<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear Cache - TattooStencilPro</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #000;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            max-width: 600px;
            padding: 2rem;
        }
        button {
            background: #fff;
            color: #000;
            border: none;
            padding: 1rem 2rem;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 8px;
            margin: 0.5rem;
        }
        button:hover {
            background: #f0f0f0;
        }
        .status {
            margin: 2rem 0;
            padding: 1rem;
            border: 1px solid #444;
            border-radius: 8px;
        }
        .success {
            border-color: #4CAF50;
            color: #4CAF50;
        }
        .error {
            border-color: #f44336;
            color: #f44336;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Limpieza de Caché</h1>
        <p>Esta página te ayudará a limpiar todos los cachés del navegador para TattooStencilPro.</p>
        
        <div id="status" class="status">
            Estado: Esperando...
        </div>

        <button onclick="clearAll()">Limpiar Todo el Caché</button>
        <button onclick="checkServiceWorkers()">Verificar Service Workers</button>
        <button onclick="hardRefresh()">Recargar Sin Caché</button>

        <div style="margin-top: 3rem; font-size: 0.9rem; opacity: 0.7;">
            <p>💡 Tip: También puedes usar:</p>
            <p>Windows/Linux: Ctrl + Shift + R</p>
            <p>Mac: Cmd + Shift + R</p>
        </div>
    </div>

    <script>
        const statusDiv = document.getElementById('status');
        
        async function clearAll() {
            statusDiv.textContent = 'Limpiando caché...';
            statusDiv.className = 'status';
            
            try {
                // 1. Clear localStorage
                localStorage.clear();
                console.log('✓ LocalStorage limpiado');
                
                // 2. Clear sessionStorage
                sessionStorage.clear();
                console.log('✓ SessionStorage limpiado');
                
                // 3. Unregister all service workers
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for (let registration of registrations) {
                        await registration.unregister();
                        console.log('✓ Service Worker desregistrado:', registration.scope);
                    }
                }
                
                // 4. Clear caches
                if ('caches' in window) {
                    const names = await caches.keys();
                    for (let name of names) {
                        await caches.delete(name);
                        console.log('✓ Cache eliminado:', name);
                    }
                }
                
                statusDiv.textContent = '✅ Todo el caché ha sido limpiado. Recargando página...';
                statusDiv.className = 'status success';
                
                // Reload after 2 seconds
                setTimeout(() => {
                    window.location.replace('/');
                }, 2000);
                
            } catch (error) {
                statusDiv.textContent = '❌ Error limpiando caché: ' + error.message;
                statusDiv.className = 'status error';
                console.error(error);
            }
        }
        
        async function checkServiceWorkers() {
            statusDiv.textContent = 'Verificando Service Workers...';
            statusDiv.className = 'status';
            
            try {
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    if (registrations.length === 0) {
                        statusDiv.textContent = '✅ No hay Service Workers registrados';
                        statusDiv.className = 'status success';
                    } else {
                        const info = registrations.map(r => `Scope: ${r.scope}, Active: ${r.active ? 'Sí' : 'No'}`).join('\n');
                        statusDiv.textContent = `⚠️ Service Workers encontrados:\n${info}`;
                        statusDiv.className = 'status';
                    }
                } else {
                    statusDiv.textContent = 'Service Workers no soportados en este navegador';
                    statusDiv.className = 'status';
                }
            } catch (error) {
                statusDiv.textContent = '❌ Error verificando: ' + error.message;
                statusDiv.className = 'status error';
            }
        }
        
        function hardRefresh() {
            statusDiv.textContent = '🔄 Recargando sin caché...';
            statusDiv.className = 'status';
            
            // Force reload ignoring cache
            window.location.reload(true);
        }
        
        // Check on load
        window.addEventListener('load', () => {
            checkServiceWorkers();
        });
    </script>
</body>
</html>
